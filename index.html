<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unidad de Equipos Móviles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: rgba(0, 0, 0, 0.55);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.25);
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #00e5ff;
    }

    p {
      font-size: 0.95rem;
      margin-bottom: 30px;
      color: #cfd8dc;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      color: #0f2027;
      background: linear-gradient(135deg, #00e5ff, #1de9b6);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.9);
    }

    footer {
      margin-top: 25px;
      font-size: 0.75rem;
      color: #90a4ae;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📱</div>
    <h1>Unidad de Equipos Móviles</h1>
    <p>Gestión y soporte tecnológico de dispositivos móviles</p>

    <button class="btn"
  onclick="window.location.href='https://script.google.com/macros/s/AKfycbx3RVc2aiKAN-TH-eHZU1LDuM96gtKpNcM_w2_wrYePPhOt93gCCC317aPY6BtUUsBl/exec'">
  Gestión de Turnos y Passwords
</button>

    <footer>
      © 2026 Unidad de Equipos Móviles
    </footer>
  </div>

</body>
</html>
