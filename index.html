<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unidad de Equipos Móviles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: rgba(0, 0, 0, 0.55);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.25);
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #00e5ff;
    }

    p {
      font-size: 0.95rem;
      margin-bottom: 30px;
      color: #cfd8dc;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      color: #0f2027;
      background: linear-gradient(135deg, #00e5ff, #1de9b6);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.9);
    }

    footer {
      margin-top: 25px;
      font-size: 0.75rem;
      color: #90a4ae;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📱</div>
    <h1>Unidad de Equipos Móviles</h1>
    <p>Gestión y soporte tecnológico de dispositivos móviles</p>

    <!-- BOTÓN CON VALIDACIÓN DE USUARIO Y CONTRASEÑA -->
    <button class="btn" onclick="mostrarLogin()">
      Gestión de Passwords
    </button>

    <footer>
      © 2026 Unidad de Equipos Móviles
    </footer>
  </div>

  <!-- MODAL LOGIN -->
  <div id="loginModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); align-items:center; justify-content:center;">
    <div style="background:#111; padding:25px; border-radius:12px; width:300px; text-align:center; box-shadow:0 0 20px #00e5ff;">
      <h3 style="color:#00e5ff; margin-bottom:15px;">Acceso restringido</h3>
      <input id="user" type="text" placeholder="Usuario" style="width:100%; padding:10px; margin-bottom:10px; border-radius:6px; border:none;" />
      <input id="pass" type="password" placeholder="Contraseña" style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:none;" />
      <button class="btn" onclick="validarLogin()">Ingresar</button>
      <p id="error" style="color:#ff5252; font-size:0.8rem; margin-top:10px; display:none;">Usuario o contraseña incorrectos</p>
    </div>
  </div>

  <script>
    const USUARIO = "M0viles";
    const PASSWORD = "3quip0$";
    const DESTINO = "hhttps://script.google.com/macros/s/AKfycbzCzcgg0llPNDPdYupUNv0TTA7owxD2vYDxgmFyqdzEydBHawIHhYJ19uBYNQaikGS5/exec"; // CAMBIAR POR TU URL REAL

    function mostrarLogin() {
      document.getElementById('loginModal').style.display = 'flex';
    }

    function validarLogin() {
      const u = document.getElementById('user').value;
      const p = document.getElementById('pass').value;

      if (u === USUARIO && p === PASSWORD) {
        window.location.href = DESTINO;
      } else {
        document.getElementById('error').style.display = 'block';
      }
    }
  </script>
</body>
</html>
